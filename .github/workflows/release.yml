name: CD · Public Knowledge Base
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knowledge-base-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: node scripts/security-check.mjs && npm run check && npm run build && node scripts/verify-build.mjs
      - run: node -e 'require("fs").writeFileSync("dist/release-sha.json",JSON.stringify({sha:process.env.GITHUB_SHA}))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale release
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public exact SHA and routes
        run: |
          set -eu
          base=https://duykhang68.github.io/khoahoctienghan
          for attempt in $(seq 1 12); do
            marker=$(curl -fsS --max-time 15 "$base/release-sha.json?v=$GITHUB_SHA-$attempt" || true)
            if test "$(printf '%s' "$marker" | jq -r '.sha' 2>/dev/null || true)" = "$GITHUB_SHA"; then
              curl -fsS --max-time 15 "$base/" >/dev/null
              curl -fsS --max-time 15 "$base/ngon-ngu/hangul/" >/dev/null
              curl -fsS --max-time 15 "$base/techblog/" >/dev/null
              echo "VERIFIED $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Production exact SHA verification failed" >&2
          exit 1
