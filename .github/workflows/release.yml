name: CD · Public Knowledge Base
on:
  workflow_run:
    workflows: ['P0 · Knowledge Base CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Optional exact current main SHA'
        required: false
        type: string
      ci_run_id:
        description: 'Optional exact main CI run ID'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: knowledge-base-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'duykhang68/khoahoctienghan' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Select latest verified main CI
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.expected_sha }}
          REQUESTED_RUN: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ -n "$REQUESTED_SHA" && ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ -n "$REQUESTED_RUN" && ! "$REQUESTED_RUN" =~ ^[0-9]+$ ]]; then
            echo "Invalid release inputs" >&2; exit 1
          fi
          if [[ -n "$REQUESTED_SHA" && "$REQUESTED_SHA" != "$sha" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'SUPERSEDED: requested SHA is no longer current' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The handoff dispatch can arrive before its parent CI finishes.
          # Bounded wait only for an explicit request, not a scheduled polling loop.
          for attempt in $(seq 1 12); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$sha&per_page=30" --jq '[.workflow_runs[] | select(.head_repository.full_name == "'"$GITHUB_REPOSITORY"'" and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.id) | last // {}')
            id=$(jq -r '.id // empty' <<< "$run")
            if [[ -n "$REQUESTED_RUN" && "$id" != "$REQUESTED_RUN" ]]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo 'DEFERRED: requested CI is not the latest exact main CI' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ -z "$REQUESTED_RUN" || $(jq -r '.status' <<< "$run") == completed ]]; then break; fi
            sleep 5
          done
          if [[ -z "$id" || $(jq -r '.status' <<< "$run") != completed || $(jq -r '.conclusion' <<< "$run") != success ]]; then
            if [[ -n "$REQUESTED_RUN" && $(jq -r '.status' <<< "$run") != completed ]]; then
              echo 'Handoff CI did not finish within the bounded wait' >&2; exit 1
            fi
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'DEFERRED: current main does not have successful CI yet' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          event=$(jq -r .event <<< "$run")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '.jobs' |
            jq -e --arg event "$event" 'length>0 and all(.[]; .conclusion=="success" or ($event!="workflow_dispatch" and .name=="Release handoff" and .conclusion=="skipped")) and any(.[]; .name=="Content and Astro build" and .conclusion=="success")' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts' |
            jq -e 'any(.[]; .name=="knowledge-base-release" and .expired==false and .size_in_bytes>0)' >/dev/null
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$sha" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"; echo 'SUPERSEDED: main advanced' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # Deduplicate after acquiring the release concurrency group.
          base=https://duykhang68.github.io/khoahoctienghan
          marker=$(curl -fsS --max-time 10 "$base/release-sha.json?v=$GITHUB_RUN_ID" || true)
          if [[ $(printf '%s' "$marker" | jq -r '.sha' 2>/dev/null || true) == "$sha" ]] &&
             curl -fsS --max-time 10 "$base/" >/dev/null &&
             curl -fsS --max-time 10 "$base/ngon-ngu/hangul/" >/dev/null &&
             curl -fsS --max-time 10 "$base/techblog/" >/dev/null; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "ALREADY_VERIFIED $sha" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run=$id" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.select.outputs.ready == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.run }}
          name: knowledge-base-release
          path: dist
      - name: Check exact artifact provenance
        if: steps.select.outputs.ready == 'true'
        env:
          EXPECTED_SHA: ${{ steps.select.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(jq -r .sha dist/release-sha.json)" = "$EXPECTED_SHA"
          test -f dist/index.html && test -f dist/techblog/index.html
          test -z "$(find dist -type l -print -quit)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.select.outputs.ready == 'true'
        with:
          path: dist
  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.fresh.outputs.eligible }}
    steps:
      - name: Check release is still current
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$EXPECTED_SHA" ]]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo "SUPERSEDED: $EXPECTED_SHA replaced by $current" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.fresh.outputs.eligible == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  verify:
    needs: [prepare, deploy]
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify public exact SHA and routes
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          base=https://duykhang68.github.io/khoahoctienghan
          for attempt in $(seq 1 12); do
            marker=$(curl -fsS --max-time 10 "$base/release-sha.json?v=$EXPECTED_SHA-$attempt" || true)
            if test "$(printf '%s' "$marker" | jq -r '.sha' 2>/dev/null || true)" = "$EXPECTED_SHA"; then
              curl -fsS --max-time 15 "$base/" >/dev/null
              curl -fsS --max-time 15 "$base/ngon-ngu/hangul/" >/dev/null
              curl -fsS --max-time 15 "$base/techblog/" >/dev/null
              echo "VERIFIED $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Production exact SHA verification failed" >&2
          exit 1
