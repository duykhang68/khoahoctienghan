name: P0 · Knowledge Base CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Content and Astro build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: node scripts/security-check.mjs
      - name: Verify Functional Core boundaries and context budgets
        run: |
          npm run check:architecture
          npm run benchmark:context -- --check
      - run: npm run check
      - run: npm run test:engineering
      - name: Install locked Reddit Editor dependencies
        run: npm ci --prefix editor --no-audit --no-fund
      - name: Build migrated Editor (local only)
        run: npm --prefix editor run build
      - name: Verify full upstream Editor snapshot
        run: |
          set -euo pipefail
          test "$(git -C editor-original rev-parse HEAD)" = "1a1c3f3efc72b530c1c76ce494bdebd8baa3f795"
          test -z "$(git -C editor-original status --porcelain)"
      - name: Install original locked Editor dependencies
        run: npm ci --prefix editor-original --no-audit --no-fund
      - name: Original Editor syntax and tests
        run: npm --prefix editor-original run check
      - name: Original Editor frontend build
        run: npm --prefix editor-original run build
      - name: Independent GitHub Editor integration tests
        run: node --test tests/editor-github.test.mjs
      - name: Build original Editor with GitHub overlay
        run: node editor-original/node_modules/vite/bin/vite.js build --config editor-github/vite.config.mjs --configLoader runner --outDir dist-github
      - run: npm run build
      - run: node scripts/verify-build.mjs
      - name: Install Chromium headless shell only
        run: npx playwright install --only-shell chromium
      - name: Browser smoke — original Editor without Cashflow redirect
        run: npx playwright test --config playwright.editor.config.ts
      - run: npm run test:e2e -- --workers=2
      - name: Validate release marker and public catalog against actual build
        run: node scripts/write-release-marker.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: knowledge-base-release
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-debug
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
  release-handoff:
    name: Release handoff
    needs: quality
    if: github.repository == 'duykhang68/khoahoctienghan' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      # No checkout, PR code, artifact execution or shared credentials in this job.
      - name: Dispatch exact main release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "SUPERSEDED: $GITHUB_SHA"
            exit 0
          fi
          jq -n --arg sha "$GITHUB_SHA" --arg id "$GITHUB_RUN_ID" '{ref:"main",inputs:{expected_sha:$sha,ci_run_id:$id}}' |
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" --input -
