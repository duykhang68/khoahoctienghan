name: P0 · Knowledge Base CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Content and Astro build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: node scripts/security-check.mjs
      - run: npm run check
      - run: npm run test:engineering
      - run: npm run build
      - run: node scripts/verify-build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Mark trusted main artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node -e 'require("fs").writeFileSync("dist/release-sha.json",JSON.stringify({sha:process.env.GITHUB_SHA}))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'knowledge-base-release' || 'knowledge-base-preview' }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-debug
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
