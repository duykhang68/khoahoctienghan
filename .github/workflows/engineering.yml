name: Engineering · Learn and Reconcile
on:
  workflow_run:
    workflows: ['P0 · Knowledge Base CI','CD · Public Knowledge Base']
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  schedule:
    - cron: '32 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: engineering-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'duykhang68/khoahoctienghan' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Privileged workflow: only trusted main, never checkout or execute PR code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/engineering-controller.mjs
        env:
          GH_TOKEN: ${{ github.token }}
