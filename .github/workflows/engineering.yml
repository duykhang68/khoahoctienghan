name: Engineering · Learn and Reconcile
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['P0 · Knowledge Base CI','CD · Public Knowledge Base']
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]
    branches: [main]
  schedule:
    - cron: '32 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: engineering-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'duykhang68/khoahoctienghan' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'duykhang68'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Privileged workflow: only trusted main, never checkout or execute PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/engineering-controller.mjs
        env:
          GH_TOKEN: ${{ github.token }}
